<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Lumi AI - Your AI Study Assistant</title>
    <meta name="description" content="Upload study materials and Lumi turns them into conversations, quizzes, flashcards, and review." />
    <link rel="canonical" href="https://www.studywithlumi.com/" />

    <!-- Favicons (served from /public at the site root) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f3edde" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- The Luminarium type system: Fraunces (display serif), Schibsted
         Grotesk (UI/body), Spline Sans Mono (instrument labels). Loaded here
         (not via CSS @import) so the fetch starts in parallel with the JS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=Spline+Sans+Mono:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumi AI" />
    <meta property="og:title" content="Lumi AI - Your AI Study Assistant" />
    <meta property="og:description" content="Upload study materials and Lumi turns them into conversations, quizzes, flashcards, and review." />
    <meta property="og:url" content="https://www.studywithlumi.com/" />
    <meta property="og:image" content="https://www.studywithlumi.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lumi AI - Your AI Study Assistant" />
    <meta name="twitter:description" content="Upload study materials and Lumi turns them into conversations, quizzes, flashcards, and review." />
    <meta name="twitter:image" content="https://www.studywithlumi.com/og-image.png" />

    <!-- Structured data: brand + logo, site, and app (helps Google show the
         correct name/logo and understand the product). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.studywithlumi.com/#organization",
            "name": "Lumi AI",
            "url": "https://www.studywithlumi.com/",
            "logo": "https://www.studywithlumi.com/logo.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.studywithlumi.com/#website",
            "name": "Lumi AI",
            "url": "https://www.studywithlumi.com/",
            "publisher": { "@id": "https://www.studywithlumi.com/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Lumi AI",
            "url": "https://www.studywithlumi.com/",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web",
            "description": "Upload study materials and Lumi turns them into conversations, quizzes, flashcards, and review.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
